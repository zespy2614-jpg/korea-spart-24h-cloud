      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getFilteredItems() {
      const q = state.query.trim().toLowerCase();
      return ALL_ITEMS.filter(it => {
        if (state.tab === 'living' && it.tab !== 'living') return false;
        if (state.tab === 'tech_outdoor' && it.tab === 'living') return false;
        if (!q) return true;
        const hay = (it.t + ' ' + it.cat + ' ' + it.bulk + ' ' + it.nvNote + ' ' + it.note).toLowerCase();
        return hay.includes(q);
      });
    }

    function render() {
      searchInput.value = state.query;
      clearSearchBtn.classList.toggle('visible', state.query.trim().length > 0);

      tabBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === state.tab);
      });
      quickChips.forEach(chip => {
        chip.classList.toggle('active', state.query.trim() === chip.dataset.kw);
      });

      const filtered = getFilteredItems();
      resultCountText.textContent = '실수요 높은 순 ' + filtered.length + '개 품목';

      if (filtered.length === 0) {
        itemListEl.innerHTML = '<div class="empty-box">검색하신 조건에 맞는 품목이 없습니다. 다른 단어로 검색해 보세요.</div>';
        moreWrap.style.display = 'none';
        return;
      }

      const slice = filtered.slice(0, state.visibleCount);
      itemListEl.innerHTML = slice.map(it => {
        return '<article class="item-card">' +
          '<div class="card-top">' +
            '<span class="rank-pill">전체 ' + it.r + '위</span>' +
            '<span class="cat-pill">' + escapeHtml(it.cat) + '</span>' +
          '</div>' +
          '<h2 class="item-title">' + escapeHtml(it.t) + '</h2>' +
          '<div class="metrics-grid">' +
            '<div class="m-col"><span class="m-lbl">한 달 구매량</span><span class="m-val">월 ' + it.ms.toLocaleString() + '개</span></div>' +
            '<div class="m-col"><span class="m-lbl">네이버 월 검색</span><span class="m-val">' + it.nv.toLocaleString() + '회</span></div>' +
            '<div class="m-col"><span class="m-lbl">누적 상품평</span><span class="m-val">' + it.rev.toLocaleString() + '건</span></div>' +
          '</div>' +
          '<p class="supply-line"><strong>안정 공급처:</strong> ' + escapeHtml(it.bulk) + '</p>' +
          '<button type="button" class="primary-cta" data-rank="' + it.r + '">' +
            '<span>공급처 직링크 · 실판매 수치 보기</span>' +
          '</button>' +
        '</article>';
      }).join('');

      if (filtered.length > state.visibleCount) {
        moreWrap.style.display = 'block';
        loadMoreBtn.textContent = '다음 순위 더 보기 (' + state.visibleCount + ' / ' + filtered.length + ')';
      } else {
        moreWrap.style.display = 'none';
      }
    }

    function openModal(rank) {
      const it = ALL_ITEMS.find(x => x.r === Number(rank));
      if (!it) return;
      modalTitleEl.textContent = '[' + it.r + '위] ' + it.t;
      modalBodyEl.innerHTML =
        '<div class="detail-block">' +
          '<h3>쿠팡 · 아마존 · 네이버 실수요 검증</h3>' +
          '<p><strong>월간 합산 구매량:</strong> 월 ' + it.ms.toLocaleString() + '개 (아마존 ' + it.amzS.toLocaleString() + '개 / 한국 ' + it.krS.toLocaleString() + '개)</p>' +
          '<p><strong>네이버 검색 수요:</strong> ' + escapeHtml(it.nvNote) + '</p>' +
          '<p><strong>실측 리뷰 합계:</strong> ' + it.rev.toLocaleString() + '건 (쿠팡 ' + it.cpRev.toLocaleString() + '건 / 아마존 ' + it.amzRev.toLocaleString() + '건)</p>' +
          '<p><strong>쿠팡 형성 판매가:</strong> ' + escapeHtml(it.cpPrice) + '</p>' +
        '</div>' +
        '<div class="detail-block">' +
          '<h3>중국 시엔위 대량 공급처 & 1688 원청 조합</h3>' +
          '<p><strong>시엔위 도매 물량:</strong> ' + escapeHtml(it.bulk) + '</p>' +
          '<p><strong>시엔위 상세 스펙:</strong> ' + escapeHtml(it.xySpec) + '</p>' +
          '<p><strong>1688 케이스·키트 공장:</strong> ' + escapeHtml(it.aliName) + ' (' + escapeHtml(it.aliSpec) + ')</p>' +
        '</div>' +
        '<div class="detail-block">' +
          '<h3>핵심 판매 포인트</h3>' +
          '<p>' + escapeHtml(it.note) + '</p>' +
        '</div>' +
        '<div class="link-stack">' +
          '<a class="ext-btn xianyu" href="' + escapeHtml(it.xyUrl) + '" target="_blank" rel="noopener noreferrer">시엔위 대량 공급처 매물 열기</a>' +
          '<a class="ext-btn ali" href="' + escapeHtml(it.aliUrl) + '" target="_blank" rel="noopener noreferrer">1688 케이스·부품 원청 공장 열기</a>' +
          '<a class="ext-btn coupang" href="' + escapeHtml(it.cpUrl) + '" target="_blank" rel="noopener noreferrer">쿠팡 실판매 비교 상품 열기</a>' +
        '</div>';

      modalEl.classList.add('open');
      try {
        history.pushState({ modalRank: it.r }, '');
      } catch (e) {}
    }

    function closeModal(fromPopState) {
      if (!modalEl.classList.contains('open')) return;
      modalEl.classList.remove('open');
      if (!fromPopState && history.state && history.state.modalRank) {
        try { history.back(); } catch (e) {}
      }
    }

    searchInput.addEventListener('focus', () => {
      setTimeout(() => {
        try { searchInput.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
      }, 60);
    });

    searchInput.addEventListener('input', () => {
      state.query = searchInput.value;
      state.visibleCount = 25;
      saveState();
      render();
    });

    clearSearchBtn.addEventListener('click', () => {
      if (!allowTap()) return;
      state.query = '';
      state.visibleCount = 25;
      saveState();
      render();
    });

    quickChips.forEach(chip => {
      chip.addEventListener('click', () => {
        if (!allowTap()) return;
        const kw = chip.dataset.kw || '';
        state.query = state.query.trim() === kw ? '' : kw;
        state.fromChip = Boolean(state.query);
        state.tab = 'all';
        state.visibleCount = 25;
        saveState();
        render();
      });
    });

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (!allowTap()) return;
        state.tab = btn.dataset.tab || 'all';
        if (state.fromChip || getFilteredItems().length === 0) {
          state.query = '';
          state.fromChip = false;
        }
        state.visibleCount = 25;
        saveState();
        render();
      });
    });

    loadMoreBtn.addEventListener('click', () => {
      if (!allowTap()) return;
      state.visibleCount += 25;
      render();
    });

    itemListEl.addEventListener('click', e => {
      const btn = e.target.closest('.primary-cta');
      if (!btn) return;
      if (!allowTap()) return;
      openModal(btn.dataset.rank);
    });

    closeModalBtn.addEventListener('click', () => {
      if (!allowTap()) return;
      closeModal(false);
    });

    modalEl.addEventListener('click', e => {
      if (e.target === modalEl) closeModal(false);
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal(false);
    });

    window.addEventListener('popstate', () => {
      closeModal(true);
    });

    render();
  </script>
</body>
</html>
